title: "SanskritSpellCheck derived-data package v1: confusion pairs, do-not-file whitelists, orthographic reform maps, and meter-verdict/GRETIL-typo indices for the Cologne Digital Sanskrit Dictionaries"

upload_type: dataset

description: >
  Six derived-data assets built by the SanskritSpellCheck QA toolset over the Cologne
  Digital Sanskrit Dictionaries (CDSL): (1) 3,884 o_vs_O minimal-pair headword confusions
  across CDSL dictionaries and the confusion-weight model mined from them; (2) a
  2,297-headword deduplicated do-not-file suppression list plus per-dictionary counts
  (2,549 total across 33 dictionaries) documenting intentional non-standard spellings
  found by body-grounded LLM triage against each dictionary's own entry text; (3) the
  122-row first-pass FILE-FIRST verified-correction candidate set plus the 156-row
  union-across-runs FILE-FIRST set (roadmap ruling D7 — a second independent triage pass
  on the three highest-yield dictionaries SHS/YAT/ACC unioned against the first, a
  measured +81% recall gain); (4) orthographic reform maps for German (15,685 pairs),
  Russian (7,709), French (18), English (76), and Latin (0) gloss-language tokens found
  inside CDSL entry bodies, tracking 19th-century-to-2026 spelling drift; (5) a
  hand-verified GRETIL e-text corrections report (60 verified error loci across 7 texts)
  plus its candidate screen (124 loci); (6) a batch chandas (meter) validation summary
  (variety census, multi-section error candidates, corpus manifest) across 5 GRETIL
  Kavya sections (~26k verses). See README.md for full schema, provenance, and caveats
  per asset.

